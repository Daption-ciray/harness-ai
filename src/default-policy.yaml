# harness-ai policy. Hand-edited, reviewed in git, and off-limits to the agents
# (see permissions.never_edit) so the harness cannot loosen its own guardrails.
version: 1

repo: # `scout` fills these in; correct them by hand when it guesses wrong
  default_branch: main
  test_cmd: "npm test"
  build_cmd: "npm run build"
  lint_cmd: "npm run lint"
  # Run once in every fresh worktree. A worktree has no gitignored dependency
  # directory, so the test command would fail without this.
  worktree_setup_cmd: "ln -sfn $HARNESS_REPO_ROOT/node_modules node_modules"

runtime:
  # container = `docker sandbox`. The repository's own commands — worktree setup,
  #             the test sensor, and the test run before an automatic merge —
  #             execute in a VM-backed sandbox with default-deny egress. That
  #             last one runs code the agents just wrote, moments before it
  #             reaches the default branch, and it is the only place the OS
  #             sandbox does not cover: that one guards the agents' tool use,
  #             not the harness's own subprocesses.
  #             Needs Docker running, and an image that carries this repo's
  #             toolchain — see runtime.sandbox_image.
  # os        = the Claude Code sandbox (macOS Seatbelt, Linux/WSL2). Kernel
  #             level over the agents' Bash and every child process.
  # none      = explicit opt-out.
  sandbox: os
  # sandbox_image: node:24    # when the default agent image cannot build this repo
  max_concurrent_builders: 4
  tick_seconds: 60
  lease_ttl_seconds: 900

# Model and effort per role. Effort is the primary knob, model the secondary one.
roles:
  planner:   { model: claude-opus-5,     effort: high,   maxTurns: 20 }
  builder:   { model: claude-opus-5,     effort: xhigh,  maxTurns: 40 }
  adversary: { model: claude-opus-5,     effort: high,   maxTurns: 25 }
  review:    { model: claude-opus-5,     effort: medium, maxTurns: 15, tools: [] }
  security:  { model: claude-opus-5,     effort: xhigh,  maxTurns: 20, never_downgrade: true, preempt: true }
  devops:    { model: claude-opus-5,     effort: medium, maxTurns: 15 }
  scribe:    { model: claude-haiku-4-5,  effort: low,    maxTurns: 6,  tools: [] }

# Start cheap, climb on failure. Most tasks finish on the first rung.
escalation_ladder:
  - { model: claude-sonnet-5, effort: medium }
  - { model: claude-opus-5,   effort: high }
  - { model: claude-opus-5,   effort: xhigh, include_adversary_report: true }
  - { escalate_to_human: true }

# Which rung each class starts on. A script learns real success rates from
# events.jsonl and proposes changes here; it never applies them itself.
ladder_start:
  trivial: 0
  routine: 0
  risky: 1 # risky never starts on sonnet

# Classification is deterministic - file globs, diff size, backlog source, retry
# count. No model is asked which model to use; the decision itself must be free.
task_class:
  risky:
    match:
      - "**/auth/**"
      - "**/crypto/**"
      - "**/*migration*"
      - "package.json"
      - ".github/workflows/**"
      - "**/Dockerfile"
      - "**/*secret*"
    source: [cve_scan]
    override: { effort: max }
  trivial:
    match: ["**/*.md", "**/*.test.*"]
    source: [todo_harvest]
    max_files: 2
    override: { model: claude-sonnet-5, effort: low }
  routine: {}

# (domain, severity) -> lease holder. First match wins; `default` is the fallback.
routing:
  - { match: "**/auth/**|**/crypto/**|**/*secret*", owner: security }
  - { match: "**/*migration*", owner: security }
  - { match: "**/api/**", owner: review }
  - { on: ci_result, owner: devops }
  - { default: true, owner: planner }

veto:
  security:  { type: hard }
  review:    { type: soft, max_rounds: 2 }
  adversary: { type: soft, max_rounds: 3 }
  devops:    { type: soft, max_rounds: 3 }

budget:
  per_task_usd: 2.00
  per_day_usd: 25.00
  on_exceed: pause

merge:
  # Off by design, not because it is unfinished. Turning it on is your
  # deliberate act — and even then the first 20 merges still go to you.
  auto: false
  max_pending_escalated: 3
  escalate_when:
    - first_n_merges: 20 # autonomy is earned, not granted
    - origin: untrusted # no exceptions - this is the prompt-injection cut-off
    - task_class: risky
    - security_finding: any
    - review_rounds: ">=2"
    - diff_files: ">15"
    - public_api_change: true
    - acceptance_unmet: any
    - path_touched: "SPEC.md|.harness/**" # may propose, may not self-merge

memory:
  # The brief is prepended to every agent, so anything stale in it is paid for on
  # every spawn. Measured in characters because that is what is enforced;
  # roughly four to a token, so this is about 2k tokens.
  context_budget_chars: 8000
  decisions_in_context: 8
  pitfall_threshold: 3

sensors:
  broken_tests: { enabled: true,  every: "15m", origin: trusted }
  open_issues:  { enabled: true,  every: "30m", origin: untrusted }
  todo_harvest: { enabled: false, every: "24h", origin: trusted }
  cve_scan:     { enabled: false, every: "24h", origin: trusted }

permissions:
  deny_all_roles:
    - "Bash(git *)"
    - "Bash(gh *)"
    - "Bash(rm -rf *)"
  git_allowed_for: [devops] # single writer for git/CI, the way scribe is for memory
  never_edit:
    - ".harness/**"          # the harness may propose policy changes, never apply them
    - ".github/workflows/**" # CI runs arbitrary code; editing it is a privilege escalation
  write_scope: repo_only
  never_read:                # credentials, including the ones that pay for the run
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.config/anthropic/**"
    - "~/.claude/**"
    - "~/.npmrc"
    - "**/.env"
    - "**/.env.*"
  network_allowlist:
    - registry.npmjs.org
    - github.com
    - api.anthropic.com
